kind = "web"
previewPath = "/"
title = "BelkhAI Trader"
version = "1.0.0"
id = "artifacts/belkhayate-trader"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20412

[services.development]
run = "pnpm --filter @workspace/belkhayate-trader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/belkhayate-trader", "run", "build" ]
publicDir = "artifacts/belkhayate-trader/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20412"
BASE_PATH = "/"
